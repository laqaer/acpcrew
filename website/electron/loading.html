<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Junction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #e4a54a;
      --backdrop: #0c0d12;
      --ink: #ffffff;
      --ink-status: #ffffff;
      --title-shadow: 0 6px 34px rgba(0,0,0,0.30);
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--backdrop);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    #stage {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%,
          color-mix(in srgb, var(--accent) 55%, #0c0d12 45%),
          var(--backdrop) 72%);
      opacity: 1; transition: opacity 0.5s ease;
      will-change: opacity;
    }
    #stage.gone { opacity: 0; }
    #mark {
      position: absolute; left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      width: min(28vw, 180px); height: min(28vw, 180px);
      opacity: 0.92;
    }
    #mark svg { width: 100%; height: 100%; display: block; }
    #title {
      position: absolute; left: 50%; top: 58%;
      transform: translate(-50%, -50%) translateY(10px) scale(0.96);
      opacity: 0; z-index: 60;
      font-family: var(--font-body);
      font-size: 66px; font-weight: 600; letter-spacing: -0.01em;
      color: var(--ink); text-shadow: var(--title-shadow);
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(.2,1,.3,1);
      white-space: nowrap;
    }
    #title.show { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
    #status {
      position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 9px; z-index: 50;
      font-family: var(--font-body);
      font-size: 14px; font-weight: 600; color: var(--ink-status);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-status); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .4; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      #stage, #title { transition-duration: .01s; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- junction-track-mark: M10 6v7.5c0 2.8 2.2 5 6 5 — shared with installer art -->
    <div id="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 22%, transparent)"/>
        <path d="M10 6v7.5c0 2.8 2.2 5 6 5h0c3.8 0 6-2.2 6-5V6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--ink)"/>
        <path d="M16 18.5V26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--ink)"/>
        <circle cx="10" cy="6" r="2.1" fill="currentColor" style="color: var(--ink)"/>
        <circle cx="22" cy="6" r="2.1" fill="currentColor" style="color: var(--ink)"/>
        <circle cx="16" cy="26" r="2.1" fill="currentColor" style="color: var(--ink)"/>
      </svg>
    </div>
    <div id="title">Junction</div>
    <div id="status"><span class="dot"></span><span id="statusText">Starting gateway&hellip;</span></div>
  </div>
  <script>
  (function () {
    "use strict";
    var accent = "#e4a54a";
    try {
      var q = new URLSearchParams(location.search).get("accent");
      if (q && /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(q)) accent = q;
    } catch (e) {}
    document.documentElement.style.setProperty("--accent", accent);

    (function () {
      function toRgb(h) {
        h = h.replace("#", "");
        if (h.length === 3) h = h[0]+h[0] + h[1]+h[1] + h[2]+h[2];
        return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
      }
      function lum(c) {
        var a = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v+0.055)/1.055, 2.4); });
        return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2];
      }
      function ratio(a, b) { var hi = Math.max(a,b), lo = Math.min(a,b); return (hi+0.05)/(lo+0.05); }
      try {
        var rgb = toRgb(accent);
        var white = lum([255, 255, 255]);
        var dark  = "rgb(12,13,18)";
        var centreLum = lum([0,1,2].map(function (i) { return Math.round(rgb[i]*0.55 + 12*0.45); }));
        var accentLum = lum(rgb);
        var root = document.documentElement.style;
        root.setProperty("--ink",        ratio(white, centreLum) < 3.0 ? dark : "#ffffff");
        root.setProperty("--ink-status", ratio(white, accentLum) < 4.5 ? dark : "#ffffff");
        root.setProperty("--title-shadow",
          ratio(white, centreLum) < 3.0 ? "0 2px 12px rgba(0,0,0,0.10)" : "0 6px 34px rgba(0,0,0,0.30)");
      } catch (e) {}
    })();

    var MIN_FLOOR_MS = 1600;
    var stage = document.getElementById("stage");
    var title = document.getElementById("title");
    var statusText = document.getElementById("statusText");
    var ready = false, resolved = false, finished = false, startedAt = performance.now();
    var latestStatus = "Starting gateway\u2026";

    function markReady() {
      ready = true;
      latestStatus = "Connected \u2713";
      statusText.textContent = latestStatus;
      maybeResolve();
    }
    function maybeResolve() {
      if (resolved || !ready) return;
      var elapsed = performance.now() - startedAt;
      if (elapsed < MIN_FLOOR_MS) { setTimeout(maybeResolve, MIN_FLOOR_MS - elapsed + 20); return; }
      resolve();
    }
    function resolve() {
      resolved = true;
      title.classList.add("show");
      setTimeout(fadeOut, 900);
    }
    function fadeOut() {
      if (finished) return; finished = true;
      var done = false;
      function notifyMain() {
        if (done) return; done = true;
        try { if (window.electronAPI && window.electronAPI.bootComplete) window.electronAPI.bootComplete(); } catch (e) {}
      }
      stage.addEventListener("transitionend", function (e) { if (e.propertyName === "opacity") notifyMain(); }, { once: true });
      stage.classList.add("gone");
      setTimeout(notifyMain, 700);
    }

    if (window.electronAPI && window.electronAPI.onStatus) {
      window.electronAPI.onStatus(function (msg) {
        if (msg) latestStatus = msg;
        if (!ready) statusText.textContent = latestStatus;
      });
    }
    if (window.electronAPI && window.electronAPI.onBootReady) {
      window.electronAPI.onBootReady(markReady);
    } else {
      var d = 2500;
      try { var r = new URLSearchParams(location.search).get("ready"); if (r != null) d = Math.max(0, parseInt(r, 10) || 0); } catch (e) {}
      setTimeout(markReady, d);
    }
  })();
  </script>
</body>
</html>
