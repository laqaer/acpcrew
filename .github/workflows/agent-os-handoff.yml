# Agent OS handoff

# Reminds, does not merge. Agent-authored PRs need a human to land.
# Contract: docs/adr/0006-agent-os-no-automerge.md

name: Agent OS handoff

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled, opened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  remind:
    if: >
      github.event.label.name == 'agent-os/ready' ||
      github.event.label.name == 'agent-os/approved' ||
      github.event.label.name == 'agent-os/triage'
    runs-on: ubuntu-latest
    steps:
      - name: Comment the handoff contract
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const isIssue = !!context.payload.issue;
            const body = {
              'agent-os/triage':
                'Scout finding. A human (or the implementer queue) promotes this to `agent-os/ready`. Agents must not open a PR from the scout turn.',
              'agent-os/ready':
                'Implementer pickup. Open a draft PR on a `cursor/*` branch. Do not merge. Do not push to main.',
              'agent-os/approved':
                'Reviewer approved. A human merges. Agents must not merge, auto-merge, or approve their own PRs.',
            }[label];
            if (!body) return;
            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
