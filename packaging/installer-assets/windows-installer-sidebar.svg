<?xml version="1.0" encoding="UTF-8"?>
<!-- NSIS welcome/finish sidebar. Ink plate and the Junction track mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <g id="junction-track-mark">
      <rect width="32" height="32" rx="8" fill="#e4a54a"/>
      <path d="M10 6v7.5c0 2.8 2.2 5 6 5h0c3.8 0 6-2.2 6-5V6" fill="none" stroke="#0c0d12" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M16 18.5V26" fill="none" stroke="#0c0d12" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="10" cy="6" r="2.1" fill="#0c0d12"/>
      <circle cx="22" cy="6" r="2.1" fill="#0c0d12"/>
      <circle cx="16" cy="26" r="2.1" fill="#0c0d12"/>
    </g>
    <clipPath id="panel">
      <rect width="164" height="314"/>
    </clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="164" height="314" fill="#0c0d12"/>
    <g transform="translate(36 52) scale(2.875)">
      <use href="#junction-track-mark"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      text-anchor="middle">
      <text x="80.81" y="190" font-size="17" font-weight="700" letter-spacing="2.38"
        fill="#e4a54a" stroke="#e4a54a" stroke-width="0.64"
        stroke-linejoin="round">JUNCTION</text>
    </g>
    <path d="M56 247H108" stroke="#e4a54a" stroke-opacity="0.55" stroke-linecap="round" stroke-width="2"/>
    <text x="82" y="274" text-anchor="middle" fill="#a1a1aa"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650">Quick setup</text>
  </g>
</svg>
