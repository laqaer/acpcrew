<?xml version="1.0" encoding="UTF-8"?>
<!-- First-download DMG background. Ink plate, copper track mark (same geometry
     as electron/loading.html and site/public/junction-mark.svg). No mascot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <g id="junction-track-mark">
      <rect width="32" height="32" rx="8" fill="#e4a54a"/>
      <path d="M10 6v7.5c0 2.8 2.2 5 6 5h0c3.8 0 6-2.2 6-5V6" fill="none" stroke="#0c0d12" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M16 18.5V26" fill="none" stroke="#0c0d12" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="10" cy="6" r="2.1" fill="#0c0d12"/>
      <circle cx="22" cy="6" r="2.1" fill="#0c0d12"/>
      <circle cx="16" cy="26" r="2.1" fill="#0c0d12"/>
    </g>
    <clipPath id="window">
      <rect width="660" height="420"/>
    </clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect width="660" height="420" fill="#0c0d12"/>
    <g opacity="0.18" transform="translate(48 28) scale(3.2)">
      <use href="#junction-track-mark"/>
    </g>
    <g opacity="0.12" transform="translate(490 260) scale(2.4)">
      <use href="#junction-track-mark"/>
    </g>
    <g transform="translate(298 168) scale(2)">
      <use href="#junction-track-mark"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      text-anchor="middle">
      <text x="327.75" y="76" font-size="32" font-weight="700" letter-spacing="4.5"
        fill="#e4a54a" stroke="#e4a54a" stroke-width="1.2"
        stroke-linejoin="round">JUNCTION</text>
      <text x="330" y="112" font-size="14.5" font-weight="600" fill="#a1a1aa">Drag Junction onto the Applications folder</text>
    </g>
    <path d="M317 225L345 246L317 267" fill="none" stroke="#e4a54a" stroke-width="7"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
